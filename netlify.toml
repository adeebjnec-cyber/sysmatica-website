# The site is published from _site, which scripts/stage.mjs fills with the public files only.
# Response headers live in _headers and redirects in _redirects, so deploys made by the
# website admin (netlify/functions/admin.mjs) keep them too.
[build]
  command = "node scripts/build.mjs && node scripts/stage.mjs"
  publish = "_site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
