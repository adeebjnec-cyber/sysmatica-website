# Builds the editable sections from content/site.json and publishes the site to GitHub Pages.
name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - name: Collect the site files
        run: |
          mkdir _site
          rsync -a --exclude='.git*' --exclude='.github' --exclude='.netlify' --exclude='_site' --exclude='scripts' --exclude='netlify.toml' --exclude='_redirects' --exclude='ADMIN.md' ./ _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
